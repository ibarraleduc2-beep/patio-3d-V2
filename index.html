    <script type="module">
        import * as THREE from 'three';

        // INDEX 30.5: cajonera Oeste + 2 repisas extraíbles totales + cajones inferiores completos.
        const TWEEN = (() => {
            const active = new Set();
            const Easing = {
                Cubic: {
                    Out: k => 1 - Math.pow(1 - k, 3),
                    InOut: k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2
                },
                Back: { Out: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); } }
            };
            class Tween {
                constructor(object) { this.object = object; this.values = {}; this.duration = 300; this.easingFn = Easing.Cubic.Out; this.startTime = 0; }
                to(values, duration) { this.values = values || {}; this.duration = duration || 300; return this; }
                easing(fn) { this.easingFn = fn || Easing.Cubic.Out; return this; }
                start(time) { this.startTime = typeof time === 'number' ? time : performance.now(); this.from = {}; for (const k in this.values) this.from[k] = this.object[k]; active.add(this); return this; }
                update(time) { const t = Math.min(1, Math.max(0, (time - this.startTime) / this.duration)); const e = this.easingFn(t); for (const k in this.values) this.object[k] = this.from[k] + (this.values[k] - this.from[k]) * e; if (t >= 1) { active.delete(this); return false; } return true; }
            }
            return { Tween, Easing, update(time) { for (const t of Array.from(active)) t.update(typeof time === 'number' ? time : performance.now()); } };
        })();

        // =========================================================================
        // GENERADORES PROCEDIMENTALES DE TEXTURAS EN ALTA DEFINICIÓN
        // =========================================================================
        function crearTexturaMaderaTecaDuelas() {
            // PVC madera lisa: veta continua tipo parota/teca, SIN duelas ni listones.
            // Se usa el mismo acabado para frentes, interiores y puertas.
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#b97845";
            ctx.fillRect(0, 0, 2048, 2048);

            // Variación suave de tono para aspecto de parota natural.
            const base = ctx.createLinearGradient(0, 0, 2048, 0);
            base.addColorStop(0, "#a9683d");
            base.addColorStop(0.22, "#c58952");
            base.addColorStop(0.48, "#b87543");
            base.addColorStop(0.72, "#c98c57");
            base.addColorStop(1, "#a9673d");
            ctx.fillStyle = base;
            ctx.fillRect(0, 0, 2048, 2048);

            // Veta longitudinal continua y orgánica, sin juntas entre tablas.
            for (let i = 0; i < 180; i++) {
                const y0 = Math.random() * 2048;
                const amp = 4 + Math.random() * 18;
                const freq = 0.0018 + Math.random() * 0.0032;
                const phase = Math.random() * Math.PI * 2;
                const alpha = 0.055 + Math.random() * 0.075;

                ctx.beginPath();
                ctx.moveTo(0, y0);
                for (let x = 0; x <= 2048; x += 18) {
                    const y = y0
                        + Math.sin(x * freq + phase) * amp
                        + Math.sin(x * freq * 0.37 + phase * 1.7) * amp * 0.45;
                    ctx.lineTo(x, y);
                }
                ctx.strokeStyle = `rgba(73, 40, 21, ${alpha})`;
                ctx.lineWidth = 1 + Math.random() * 2.2;
                ctx.stroke();
            }

            // Vetas claras paralelas para dar profundidad de madera real.
            for (let i = 0; i < 110; i++) {
                const y0 = Math.random() * 2048;
                const amp = 3 + Math.random() * 13;
                const freq = 0.002 + Math.random() * 0.0028;
                const phase = Math.random() * Math.PI * 2;

                ctx.beginPath();
                ctx.moveTo(0, y0);
                for (let x = 0; x <= 2048; x += 20) {
                    const y = y0
                        + Math.sin(x * freq + phase) * amp
                        + Math.sin(x * freq * 0.42) * amp * 0.35;
                    ctx.lineTo(x, y);
                }
                ctx.strokeStyle = `rgba(245, 205, 158, ${0.045 + Math.random() * 0.065})`;
                ctx.lineWidth = 0.8 + Math.random() * 1.6;
                ctx.stroke();
            }

            // Algunos nudos/figuras suaves, sin exagerar.
            for (let i = 0; i < 18; i++) {
                const cx = 120 + Math.random() * 1808;
                const cy = 100 + Math.random() * 1848;
                const rx = 18 + Math.random() * 34;
                const ry = 5 + Math.random() * 13;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate((Math.random() - 0.5) * 0.35);
                ctx.beginPath();
                ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(72, 38, 20, 0.16)";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.beginPath();
                ctx.ellipse(0, 0, rx * 0.55, ry * 0.32, 0, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(245, 205, 158, 0.08)";
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1.15, 1.15);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        // Textura con Cantos Rodados Negros GRANDES en Concreto Claro
        function crearTexturaPisoCantoRodadoNegroGrande() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#dedad2";
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.fillStyle = "rgba(100, 95, 88, 0.15)";
            for (let i = 0; i < 20000; i++) {
                ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 1.8, 1.8);
            }

            const paletaNegras = ["#131313", "#1a1a1a", "#222222", "#0f0f0f", "#262626", "#181818"];

            function dibujarPiedraGrande(px, py, rx, ry, rot, colorBase) {
                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(rot);

                ctx.beginPath();
                ctx.ellipse(2.2, 3.0, rx + 2.5, ry + 2.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(35, 33, 30, 0.4)";
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(0, 0, rx + 1.8, ry + 1.8, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#c5c0b5";
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = colorBase;
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(-rx * 0.28, -ry * 0.32, rx * 0.45, ry * 0.38, 0, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.26)";
                ctx.fill();

                ctx.restore();
            }

            const pasoGrid = 46;
            for (let y = -20; y < 1044; y += pasoGrid) {
                const shiftX = (Math.floor(y / pasoGrid) % 2) * 23;
                for (let x = -20 + shiftX; x < 1044; x += pasoGrid) {
                    const px = x + (Math.random() * 14 - 7);
                    const py = y + (Math.random() * 14 - 7);
                    const rx = 13.5 + Math.random() * 8.5;
                    const ry = 10.5 + Math.random() * 6.5;
                    const rot = Math.random() * Math.PI;
                    const color = paletaNegras[Math.floor(Math.random() * paletaNegras.length)];

                    dibujarPiedraGrande(px, py, rx, ry, rot, color);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(3.5, 3.5);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            texture.minFilter = THREE.LinearMipmapLinearFilter; texture.magFilter = THREE.LinearFilter;
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        // Los puntos siguientes pertenecen a la geometría existente y NO son
        // parte del muro falso del proyecto.
        const muroSurPtsContinuos = [
            EXISTENTE.pNoreste, EXISTENTE.pDiagFin, EXISTENTE.pSur2Fin, EXISTENTE.pSur3Fin, EXISTENTE.pDiag32Fin,
            [-16.36, 499.83], [22.94, 518], [195.34, 518], [195.34, 430.91], [410, 418.91]
        ];
        grupoMuroSur.add(crearMuroExtruidoEnXZ(muroSurPtsContinuos, 316, matMuroSur));

        // MURO FALSO EN L · PROYECTO
        // Es una geometría independiente. NO sustituye ni corrige la esquina
        // existente de la diagonal. Conserva los dos extremos de referencia:
        // inicio en el punto Noreste y cierre en el extremo original del tramo de 86 cm.
        const mf = CONFIG.muroFalso215;
        const mfA = EXISTENTE.pNoreste;
        const mfB = [xP1, zP1];

        // Al enderezar la diagonal conservando ambos extremos de referencia,
        // el nuevo tramo recto mide 214.3221 cm (no 215 cm).
        const largoMuroFalsoRecto = Math.abs(mfA[0] - mfB[0]);
        const muroFalso215 = crearCaja(largoMuroFalsoRecto, mf.alto, mf.grosor, matMuroSur);
        muroFalso215.position.set((mfA[0] + mfB[0]) / 2, mf.alto / 2, zP1);
        muroFalso215.userData.tipo = 'muro_falso_recto_214_32';
        grupoMuroFalso215.add(muroFalso215);

        // Ala 2: prolongación del antiguo tramo de 86 cm hasta el mismo
        // punto final original. Su nueva longitud es 103.0603 cm.
        const mfC = [xP2, zP2];
        const largoMuroFalsoLReal = Math.abs(zP2 - zP1);
        const muroFalsoL = crearCaja(mf.grosor, mf.alto, largoMuroFalsoLReal, matMuroSur);
        muroFalsoL.position.set(mfC[0], mf.alto / 2, (zP1 + zP2) / 2);
        muroFalsoL.userData.tipo = 'muro_falso_L_103_06';
        grupoMuroFalso215.add(muroFalsoL);

        grupoMuroFalso215.userData.medidas = {
            alaRectaCm: largoMuroFalsoRecto,
            alaLFinalCm: largoMuroFalsoLReal,
            diagonalExistenteCm: 215.0,
            tramoExistente86Cm: 86.0
        };

        // =========================================================================
        // COBERTIZO SUR (PUERTA PVC MADERA LISA, 3cm SOBRE PISO, RIEL SUPERIOR EN CONTACTO Y AL RAS DEL MURO OESTE)
        // =========================================================================
        let techoLavanderia = null;
        let cieloRasoLavanderia = null;
        let muroFalsoPocketGroup = null;
        let nichoSurGroupGlobal = null;
        let grupoRefrigeradorNorteGlobal = null;
        let puertaCorredizaGroupGlobal = null;
        let torreGroupGlobal = null;
        let ondaMuroNorteGroup = null;
        function construirCobertizoSur() {
            const nichoSurGroup = new THREE.Group(); nichoSurGroupGlobal = nichoSurGroup;
            const profDesague = 8;
            const hInteriorCloset = 220;

            // Datos de la torre de lavado definidos antes de cualquier referencia.
            const washerW = 70, washerH = 185, washerD = 83;
            const posZ_Torre = 446.50;
            const posX_Torre = 175.34 - 2.5 - (washerW / 2) - 1.30; // 136.54 cm; 3 cm libres al Este

            const hTotalParedes = hInteriorCloset + profDesague;
            const yCentroMuro = hTotalParedes / 2 - profDesague;
            const espP = 0.8;
            
            const v0 = v0_Suelo; // (175.34, 400) -> 98 cm Este
            const v1 = [xP2, zP2]; // (175.34, 498)
            const v2 = [xP3, zP3]; // (27.34, 498)  -> 148 cm Fondo
            const v3 = [xP4, zP4]; // (3.55, 487)   -> 32 cm Chaflán
            const v4 = v4_Suelo; // (2.91, 400)   -> 87 cm Oeste

            // 1. Paneles interiores del Cobertizo Sur
            const pIzq = new THREE.Mesh(new THREE.BoxGeometry(espP, hTotalParedes, Math.hypot(v1[0] - v0[0], v1[1] - v0[1])), matTecaLisa);
            pIzq.position.set(v1[0] - espP / 2, yCentroMuro, (v0[1] + v1[1]) / 2);
            nichoSurGroup.add(pIzq);

            // Panel de fondo del módulo Este (lavadora): llega completamente hasta el muro de fondo.
            // El módulo Oeste queda 15 cm adelantado respecto a este panel.
            const xDivisorGeometrico = (posX_Torre - washerW / 2) - 3.0 - (1.5 / 2);
            const anchoFondoEste = Math.max(1, v1[0] - xDivisorGeometrico);
            const pFondoLavadora = new THREE.Mesh(
                new THREE.BoxGeometry(anchoFondoEste, hTotalParedes, espP),
                matTecaLisa
            );
            pFondoLavadora.position.set(
                xDivisorGeometrico + anchoFondoEste / 2,
                yCentroMuro,
                v1[1] - espP / 2
            );
            nichoSurGroup.add(pFondoLavadora);

            const lenDer = Math.hypot(v4[0] - v3[0], v4[1] - v3[1]), angDer = Math.atan2(v4[1] - v3[1], v4[0] - v3[0]);
            const pDer = new THREE.Mesh(new THREE.BoxGeometry(lenDer, hTotalParedes, espP), matTecaLisa);
            pDer.rotation.y = -angDer;
            pDer.position.set((v3[0] + v4[0]) / 2, yCentroMuro, (v3[1] + v4[1]) / 2);
            nichoSurGroup.add(pDer);

            // Cierres superiores de las dos esquinas: eliminan los huecos visuales entre
            // los laterales del cobertizo y el encuentro con los muros perimetrales.
            // Panel de fondo del módulo Oeste: queda 15 cm por delante del muro de fondo, 3 cm más hacia el fondo que en INDEX 17.4.
            // Es completamente recto, atraviesa el chaflán y termina exactamente en el divisor central.
            const separacionMuroFondo = 12.0;
            const xPanelOesteInicio = v3[0];
            const anchoPanelOeste = Math.max(1, xDivisorGeometrico - xPanelOesteInicio);
            const zPanelOeste = v1[1] - separacionMuroFondo;
            const pFondoOeste = new THREE.Mesh(
                new THREE.BoxGeometry(anchoPanelOeste, hTotalParedes, espP),
                matTecaLisa
            );
            pFondoOeste.position.set(
                xPanelOesteInicio + anchoPanelOeste / 2,
                yCentroMuro,
                zPanelOeste
            );
            nichoSurGroup.add(pFondoOeste);
            // =====================================================================
            // 
            // =====================================================================
            // CAJONERA — MÓDULO OESTE — INDEX 30.5
            // =====================================================================
            // Se conserva la geometría de 17.9 y se corrige la cajonera para que
            // no existan huecos entre frentes ni un espacio entre cajones y tapa.
            // El ancho útil REAL del módulo Oeste en 17.9 es el tramo entre
            // xPanelOesteInicio y xDivisorGeometrico.
            // 2 columnas x 3 filas, frentes de 35 / 25 / 16 cm, zoclo inferior de 10 cm.
            // Cuerpo de 60 cm: quedan 26 cm libres al frente.
            // El zoclo queda retranqueado 10 cm respecto al frente de los cajones.
            // Panel superior negro horizontal inmediatamente sobre los cajones.

            const cajoneraOesteGroup = new THREE.Group();
            cajoneraOesteGroup.name = 'Cajonera_Oeste_3_Cajones';

            const anchoCajonera = Math.max(1, anchoPanelOeste - 2.0);
            const profundidadCuerpoCajonera = 60.0;
            const profundidadUtilCajonera = 86.0;
            const libreFrontalCajonera = 26.0;
            const zocloAltoCajonera = 10.0;
            // Cajonera de una sola columna: 35 cm abajo + 25 cm al centro + 16 cm arriba.
            // Altura total de frentes = 76 cm, sin separaciones verticales.
            const alturasFrentesCajonera = [35.0, 25.0, 16.0];
            const altoTotalFrentesCajonera = alturasFrentesCajonera.reduce((a, b) => a + b, 0);
            const espEstructuraCajonera = 1.8;
            const espFrenteCajonera = 2.0;

            const xInicioCajonera = xPanelOesteInicio + 1.0;
            const xFinCajonera = xInicioCajonera + anchoCajonera;
            const xCentroCajonera = (xInicioCajonera + xFinCajonera) / 2;
            const anchoColumnaCajonera = anchoCajonera;

            // Panel de fondo existente.
            const zFondoCajonera = zPanelOeste;
            const zFrenteCajonera = zFondoCajonera - profundidadCuerpoCajonera;

            // Piso interior existente.
            const yPisoCajonera = 5.0;
            const yBaseFrentes = yPisoCajonera + zocloAltoCajonera;

            const matCajonNegro = new THREE.MeshStandardMaterial({
                color: 0x111111,
                roughness: 0.78,
                metalness: 0.03
            });
            const matCajonMadera = matTKPVC; // Frente PVC madera; el interior permanece negro.

            function agregarCajaCajonNegra(w, h, d, x, y, z, destino = cajoneraOesteGroup) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matCajonNegro);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                destino.add(mesh);
                return mesh;
            }

            function agregarFrenteCajonNegro(w, h, d, x, y, z, destino) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matCajonMadera);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                destino.add(mesh);
                return mesh;
            }

            // Zoclo negro: 10 cm de alto y 10 cm retranqueado respecto al frente.
            const zZoclo = zFrenteCajonera + 10.0;
            const zCentroCuerpo = zFondoCajonera - profundidadCuerpoCajonera / 2;
            agregarCajaCajonNegra(
                anchoCajonera, zocloAltoCajonera, 10.0,
                xCentroCajonera,
                yPisoCajonera + zocloAltoCajonera / 2,
                zZoclo
            );

            // -----------------------------------------------------------------
            // CAJONES HUECOS — 6 CAJONES REALES
            // Cada cajón se modela como una caja abierta al frente: piso,
            // costados y trasera negras. El interior queda físicamente vacío.
            // -----------------------------------------------------------------
            const altoCajoneraFrentes = altoTotalFrentesCajonera;
            const yCentroFrentes = yBaseFrentes + altoCajoneraFrentes / 2;
            const altoEntrecalles = 1.0;

            // Estructura exterior y divisor central.
            agregarCajaCajonNegra(espEstructuraCajonera, altoCajoneraFrentes, profundidadCuerpoCajonera,
                xInicioCajonera + espEstructuraCajonera / 2, yCentroFrentes, zCentroCuerpo);
            agregarCajaCajonNegra(espEstructuraCajonera, altoCajoneraFrentes, profundidadCuerpoCajonera,
                xFinCajonera - espEstructuraCajonera / 2, yCentroFrentes, zCentroCuerpo);
            // Una sola columna: no existe divisor vertical central dentro de la cajonera.

            // Trasera común del mueble.
            agregarCajaCajonNegra(
                Math.max(0.5, anchoCajonera - 2 * espEstructuraCajonera),
                altoCajoneraFrentes,
                espEstructuraCajonera,
                xCentroCajonera,
                yCentroFrentes,
                zFondoCajonera - espEstructuraCajonera / 2
            );

            const anchoFrenteExacto = Math.max(0.5, anchoColumnaCajonera - espEstructuraCajonera);
            const anchoInterior = Math.max(0.5, anchoColumnaCajonera - 2 * espEstructuraCajonera);
            const profundidadInterior = Math.max(0.5, profundidadCuerpoCajonera - 2 * espEstructuraCajonera);

            let acumuladoY = yBaseFrentes;
            const gruposCajones = [];

            alturasFrentesCajonera.forEach((altoFila, fila) => {
                const yCentroFila = acumuladoY + altoFila / 2;

                {
                    const x = xCentroCajonera;
                    const grupoCajon = new THREE.Group();
                    grupoCajon.name = `Cajon_Oeste_${fila + 1}`;

                    // Cajón hueco: piso + dos costados + trasera. Sin bloque sólido.
                    const espCaja = 1.8;
                    const yPisoCaja = -altoFila / 2 + espCaja / 2;
                    const yCentroCostados = 0;
                    const zCentroCaja = 0;
                    const zFondoCaja = profundidadCuerpoCajonera - espCaja;

                    agregarCajaCajonNegra(
                        anchoInterior, espCaja, profundidadInterior,
                        0, yPisoCaja, 0, grupoCajon
                    );
                    agregarCajaCajonNegra(
                        espCaja, altoFila, profundidadInterior,
                        -anchoInterior / 2 + espCaja / 2, yCentroCostados, 0, grupoCajon
                    );
                    agregarCajaCajonNegra(
                        espCaja, altoFila, profundidadInterior,
                        anchoInterior / 2 - espCaja / 2, yCentroCostados, 0, grupoCajon
                    );
                    agregarCajaCajonNegra(
                        anchoInterior, altoFila, espCaja,
                        0, yCentroCostados, zFondoCaja - profundidadCuerpoCajonera / 2, grupoCajon
                    );

                    // Frente de madera.
                    agregarFrenteCajonNegro(
                        anchoFrenteExacto, altoFila, espFrenteCajonera,
                        0, 0, zFrenteCajonera - zCentroCuerpo + espFrenteCajonera / 2,
                        grupoCajon
                    );

                    // Hitbox frontal invisible para interacción individual.
                    const hitCajon = new THREE.Mesh(
                        new THREE.BoxGeometry(Math.max(1, anchoFrenteExacto - 2), Math.max(1, altoFila - 2), 5),
                        new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
                    );
                    hitCajon.position.set(0, 0, zFrenteCajonera - zCentroCuerpo - 0.5);
                    grupoCajon.add(hitCajon);
                    hitCajon.userData = {
                        tipo: 'extraible', grupo: grupoCajon, abierto: false,
                        posZ_cerrado: 0, posZ_abierto: -12, animando: false
                    };
                    objetosInteractivos.push(hitCajon);
                    grupoCajon.position.set(x, yCentroFila, zCentroCuerpo);
                    cajoneraOesteGroup.add(grupoCajon);
                    gruposCajones.push(grupoCajon);
                }

                acumuladoY += altoFila;
            });

            // Entrecalles horizontales negras visibles entre las tres filas.
            // No cambian las alturas nominales de los frentes: funcionan como líneas
            // de sombra/entrecale de 1 cm sobre las juntas.
            let yJunta = yBaseFrentes + alturasFrentesCajonera[0];
            for (let i = 0; i < alturasFrentesCajonera.length - 1; i++) {
                const entrecalle = new THREE.Mesh(
                    new THREE.BoxGeometry(anchoCajonera, altoEntrecalles, espFrenteCajonera + 0.35),
                    matCajonNegro
                );
                entrecalle.position.set(
                    xCentroCajonera,
                    yJunta,
                    zFrenteCajonera - 0.15
                );
                entrecalle.castShadow = true;
                entrecalle.receiveShadow = true;
                entrecalle.name = `Entrecale_Negro_Horizontal_${i + 1}`;
                cajoneraOesteGroup.add(entrecalle);
                yJunta += alturasFrentesCajonera[i + 1];
            }

            // Entrecalles verticales: al ser una sola columna, se conserva una junta perimetral limpia
            // en PVC madera y una sombra vertical mínima en los cantos, sin inventar una segunda columna.
            const anchoEntrecaleLateral = 0.8;
            for (const dx of [-anchoCajonera / 2, anchoCajonera / 2]) {
                const canto = new THREE.Mesh(new THREE.BoxGeometry(anchoEntrecaleLateral, altoTotalFrentesCajonera, espFrenteCajonera + 0.4), matCajonNegro);
                canto.position.set(xCentroCajonera + dx, yCentroFrentes, zFrenteCajonera - 0.15);
                cajoneraOesteGroup.add(canto);
            }

            // Cubierta negra inmediatamente sobre los cajones.
            const espPanelSuperior = 2.0;
            const yPanelSuperior = yBaseFrentes + altoTotalFrentesCajonera + espPanelSuperior / 2;
            const panelSuperiorCajonera = new THREE.Mesh(
                new THREE.BoxGeometry(anchoCajonera, espPanelSuperior, profundidadCuerpoCajonera),
                matCajonNegro
            );
            panelSuperiorCajonera.position.set(xCentroCajonera, yPanelSuperior, zCentroCuerpo);
            panelSuperiorCajonera.castShadow = true;
            panelSuperiorCajonera.receiveShadow = true;
            panelSuperiorCajonera.name = 'Cubierta_Negra_Cajonera_Oeste';
            cajoneraOesteGroup.add(panelSuperiorCajonera);

            // -----------------------------------------------------------------
            // 2 REPISAS DE EXTRACCIÓN TOTAL — EXCLUSIVAMENTE MÓDULO OESTE
            // -----------------------------------------------------------------
            const profundidadRepisa = 40.0; // 40 cm de fondo, ancladas al panel posterior
            const espRepisa = 2.0;
            const alturaSobreCubierta = 50.0;
            const separacionEntreRepisas = 42.0;
            const ySuperiorCubiertaNegra = yPanelSuperior + espPanelSuperior / 2;
            const yInferiorPrimeraRepisa = ySuperiorCubiertaNegra + alturaSobreCubierta;
            const yCentrosRepisas = [
                yInferiorPrimeraRepisa + espRepisa / 2,
                yInferiorPrimeraRepisa + separacionEntreRepisas + espRepisa / 2
            ];

            // IMPORTANTE: las repisas nacen y quedan apoyadas contra el panel de fondo,
            // igual que los cajones. Se mantienen exclusivamente dentro del módulo Oeste.
            const zCentroRepisa = zFondoCajonera - profundidadRepisa / 2;
            const matRepisa = matCajonNegro;

            yCentrosRepisas.forEach((yRepisa, indice) => {
                const grupoRepisa = new THREE.Group();
                grupoRepisa.name = `Repisa_Oeste_Extraible_Total_${indice + 1}`;

                const repisa = new THREE.Mesh(
                    new THREE.BoxGeometry(anchoCajonera, espRepisa, profundidadRepisa),
                    matRepisa
                );
                repisa.position.set(0, 0, 0);
                repisa.castShadow = true;
                repisa.receiveShadow = true;
                repisa.name = `Repisa_Oeste_Negra_${indice + 1}`;
                grupoRepisa.add(repisa);

                const hitRepisa = new THREE.Mesh(
                    new THREE.BoxGeometry(
                        Math.max(1, anchoCajonera - 2),
                        Math.max(1, espRepisa + 3),
                        Math.max(1, profundidadRepisa - 2)
                    ),
                    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
                );
                hitRepisa.position.set(0, 0, 0);
                grupoRepisa.add(hitRepisa);
                hitRepisa.userData = {
                    tipo: 'extraible', grupo: grupoRepisa, abierto: false,
                    posZ_cerrado: 0, posZ_abierto: -8, animando: false
                };
                objetosInteractivos.push(hitRepisa);

                // X local 0: el grupo se coloca exactamente en el centro del módulo Oeste.
                grupoRepisa.position.set(xCentroCajonera, yRepisa, zCentroRepisa);
                cajoneraOesteGroup.add(grupoRepisa);
            });

            nichoSurGroup.add(cajoneraOesteGroup);

            const lenFront = Math.hypot(v0[0] - v4[0], v0[1] - v4[1]);
            // El antiguo foso/desagüe se elimina: el interior queda sobre un escalón
            // de 5 cm, con caída total de 1 cm hacia el frente (Z=400).
            const shapeEscalon = new THREE.Shape();
            shapeEscalon.moveTo(v0[0], v0[1]);
            shapeEscalon.lineTo(v1[0], v1[1]);
            shapeEscalon.lineTo(v2[0], v2[1]);
            shapeEscalon.lineTo(v3[0], v3[1]);
            shapeEscalon.lineTo(v4[0], v4[1]);
            shapeEscalon.closePath();

            const hEscalonTrasero = 5.0;
            const caidaFrontal = 1.0;
            const profundidadEscalon = v1[1] - v0[1];
            const geomEscalon = new THREE.ExtrudeGeometry(shapeEscalon, { depth: 1, bevelEnabled: false });
            const posEscalon = geomEscalon.attributes.position;
            for (let i = 0; i < posEscalon.count; i++) {
                const x = posEscalon.getX(i);
                const z = posEscalon.getY(i);
                const capa = posEscalon.getZ(i);
                const t = Math.max(0, Math.min(1, (z - v0[1]) / profundidadEscalon));
                const ySuperior = hEscalonTrasero - (caidaFrontal * t);
                posEscalon.setXYZ(i, x, capa > 0.5 ? ySuperior : 0, z);
            }
            posEscalon.needsUpdate = true;
            geomEscalon.computeVertexNormals();
            const escalonCobertizo = new THREE.Mesh(geomEscalon, matSueloPatio);
            escalonCobertizo.name = 'Escalon_Cobertizo_5cm_Pendiente_1cm';
            escalonCobertizo.receiveShadow = true;
            escalonCobertizo.castShadow = false;
            nichoSurGroup.add(escalonCobertizo);

            // =====================================================================
            // CONTACTOS ELÉCTRICOS — 3 PUNTOS INDICADOS EN LA REFERENCIA
            // =====================================================================
            // Placas exteriores visibles, montadas sobre los muros. Se mantienen
            // fijas y no forman parte de la puerta corrediza.
            const matContactoPlaca = new THREE.MeshStandardMaterial({ color: 0xf1f1ed, roughness: 0.42, metalness: 0.0 });
            const matContactoRanura = new THREE.MeshStandardMaterial({ color: 0x25282a, roughness: 0.55, metalness: 0.15 });

            function crearContactoMuroNorte(x, y = 118) {
                const g = new THREE.Group();
                const placa = crearCaja(10, 10, 1.2, matContactoPlaca);
                placa.position.set(x, y, 0.7);
                g.add(placa);
                const ranura1 = crearCaja(1.1, 3.0, 0.5, matContactoRanura);
                ranura1.position.set(x - 1.7, y + 0.4, 1.35);
                g.add(ranura1);
                const ranura2 = crearCaja(1.1, 3.0, 0.5, matContactoRanura);
                ranura2.position.set(x + 1.7, y + 0.4, 1.35);
                g.add(ranura2);
                grupoInstalaciones.add(g);
            }

            // Dos contactos a ambos lados del asador, en los puntos marcados.
            crearContactoMuroNorte(82, 118);
            crearContactoMuroNorte(310, 118);

            // Tercer contacto: extremo Este, sobre el muro Este, en la esquina con el muro Sur.
            // NO va dentro del nicho de lavandería.
            const contactoLavanderia = new THREE.Group();
            const xContactoEste = CONFIG.muroNorte.ancho - 0.7;
            const zContactoSur = 414;
            const placaLav = crearCaja(1.2, 10, 10, matContactoPlaca);
            placaLav.position.set(xContactoEste, 118, zContactoSur);
            contactoLavanderia.add(placaLav);
            const ranuraLav1 = crearCaja(0.5, 3.0, 1.1, matContactoRanura);
            ranuraLav1.position.set(xContactoEste - 0.65, 118.4, zContactoSur - 1.7);
            contactoLavanderia.add(ranuraLav1);
            const ranuraLav2 = crearCaja(0.5, 3.0, 1.1, matContactoRanura);
            ranuraLav2.position.set(xContactoEste - 0.65, 118.4, zContactoSur + 1.7);
            contactoLavanderia.add(ranuraLav2);
            grupoInstalaciones.add(contactoLavanderia);

            // CIELO INTERIOR: panel PVC madera plano, completamente cerrado y separado de los muros.
            // Se mantiene horizontal para que visualmente se lea recto y sella todo el volumen interior.
            const shapePlanoCloset = new THREE.Shape();
            const margenCielo = 0.6;

            for (let i = 0; i < posPC.count; i++) posPC.setXYZ(i, posPC.getX(i), 219.5, posPC.getY(i));
            posPC.needsUpdate = true; geomPlanoCloset.computeVertexNormals();
            cieloRasoLavanderia = new THREE.Mesh(geomPlanoCloset, matTKPVC);

            // TECHO EXTERIOR: una sola cuña cerrada de Durock + impermeabilización + microcemento.
            // La pendiente es exclusivamente Norte-Sur (Z): 1%, con caída hacia Norte.
            const grosorTecho = 8.5;
            const zFrontRoof = 370.0; // 30 cm de alero hacia Norte.
            const zBackRoof = 498.0;
            const yRoofFront = hInteriorCloset; // intradós alineado con la coronación de los muros: sin hueco
            const pendienteTecho = 0.01;

            function getRoofBottomAtZ(z) {
                return yRoofFront + (z - zFrontRoof) * pendienteTecho;
            }
            const roofPoly = [
                [v0[0], zFrontRoof], [v1[0], zBackRoof], [v2[0], zBackRoof],
                [v3[0], v3[1]], [v4[0], zFrontRoof]
            ];
            function crearPrismaTechoCerrado(poly, thickness) {
                const contour = poly.map(p => new THREE.Vector2(p[0], p[1]));
                const tris = THREE.ShapeUtils.triangulateShape(contour, []);
                const verts = [];
                for (const [x,z] of poly) { verts.push(x, getRoofBottomAtZ(z), z); }
                for (const [x,z] of poly) { verts.push(x, getRoofBottomAtZ(z) + thickness, z); }
                const idx = [];
                for (const t of tris) idx.push(t[0], t[2], t[1]);
                for (const t of tris) idx.push(poly.length+t[0], poly.length+t[1], poly.length+t[2]);
                for (let i=0;i<poly.length;i++) {
                    const j=(i+1)%poly.length;
                    idx.push(i,j,poly.length+j, i,poly.length+j,poly.length+i);
                }
                const g=new THREE.BufferGeometry();
                g.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
                g.setIndex(idx); g.computeVertexNormals(); return g;
            }
            const geomTecho = crearPrismaTechoCerrado(roofPoly, grosorTecho);
            const losaTechoLavanderia = new THREE.Mesh(geomTecho, matMicrocemento);
            losaTechoLavanderia.name = 'Techo_Lavanderia_Durock_Impermeable_Microcemento';
            losaTechoLavanderia.castShadow = true; losaTechoLavanderia.receiveShadow = true;
            losaTechoLavanderia.renderOrder = 2;
            losaTechoLavanderia.material.side = THREE.DoubleSide;
            techoLavanderia = losaTechoLavanderia;
            nichoSurGroup.add(losaTechoLavanderia);

            // Caras continuas superior e inferior: hacen que la cubierta sea una tapa sólida,
            // no una caja abierta ni un conjunto de faldones.
            const shapeRoofTop = new THREE.Shape();
            roofPoly.forEach(([x,z], i) => { if(i===0) shapeRoofTop.moveTo(x,z); else shapeRoofTop.lineTo(x,z); });
            shapeRoofTop.closePath();
            const geomRoofTop = new THREE.ShapeGeometry(shapeRoofTop);
            const posRoofTop = geomRoofTop.attributes.position;
            for(let i=0;i<posRoofTop.count;i++){
                const x=posRoofTop.getX(i), z=posRoofTop.getY(i);
                posRoofTop.setXYZ(i, x, getRoofBottomAtZ(z)+grosorTecho+0.035, z);
            }
            posRoofTop.needsUpdate=true; geomRoofTop.computeVertexNormals();
            const roofTopCap = new THREE.Mesh(geomRoofTop, matMicrocemento);
            roofTopCap.name='Techo_Lavanderia_Cara_Superior_Solida';
            roofTopCap.material.side=THREE.DoubleSide;
            roofTopCap.renderOrder=3; roofTopCap.castShadow=true; roofTopCap.receiveShadow=true;
            techoLavanderia.add(roofTopCap);

            const geomRoofBottom = new THREE.ShapeGeometry(shapeRoofTop);
            const posRoofBottom = geomRoofBottom.attributes.position;
            for(let i=0;i<posRoofBottom.count;i++){

            const tDivisor = 1.5;

            const zDivFondo = v1[1];
            const hPisoFrenteDiv = 5.0 - 1.0;

            const yTechoFrenteDiv = getRoofBottomAtZ(zDivFrente);

            const vertsDivisor = new Float32Array([

                xDivisorGeometrico + tDivisor/2, hPisoFondoDiv, zDivFondo,

                xDivisorGeometrico + tDivisor/2, yTechoFondoDiv, zDivFondo,

            const idxDivisor = [

            // Núcleo de Durock ligeramente menor que el acabado exterior; queda completamente contenido.

            function crearEscotilla3D(radioExterior, radioCristal, posY) {

                aroCromado.rotation.x = Math.PI / 2; aroCromado.position.z = -1.3; escGroup.add(aroCromado);
                const cristalDomo = new THREE.Mesh(new THREE.CylinderGeometry(radioCristal, radioCristal, 2.8, 36), matCristalEscotilla);
                cristalDomo.rotation.x = Math.PI / 2; cristalDomo.position.z = -1.4; escGroup.add(cristalDomo);
                const manijaPuerta = crearCaja(2.2, 10.0, 1.6, matAcero); manijaPuerta.position.set(radioExterior * 0.72, 0, -2.4); escGroup.add(manijaPuerta);

            torreGroup.add(crearEscotilla3D(20.0, 16.5, washerH * 0.28));

            // =========================================================================
            // V6.8.1 — PUERTA CORREDIZA ÚNICA DE PVC MADERA LISA, AL FRENTE DEL MURO FALSO
            // Abre hacia Este (+X) y, al abrir, queda completamente delante del muro falso.
            // =========================================================================
            const wHuecoNichoSur = v0[0] - v4[0];
            const wPuertaCorrediza = wHuecoNichoSur - 2.0;
            const zPlanoPuerta = 396.8; // 3.2 cm delante del plano frontal Z=400

            // Hoja corrediza única.
            const puertaCorredizaGroup = new THREE.Group(); puertaCorredizaGroupGlobal = puertaCorredizaGroup; puertaCorredizaGroup.name="Puerta_Corrediza_Fase05";
            puertaCorredizaGroup.position.set((v0[0] + v4[0]) / 2, 0, zPlanoPuerta);

            const tPisoPuerta = Math.max(0, Math.min(1, (zPlanoPuerta - v0[1]) / profundidadEscalon));
            const yPisoPuerta = zPlanoPuerta <= v0[1]

            const yBasePuerta = yPisoPuerta + 3.0;
            const altoRielCorredizo = 2.2;

            const profundidadEmbebidoRiel = 2.0;

            dintelPocket.position.set((v0[0] + v4[0]) / 2 + (wPuertaCorrediza + 4.0) / 2, yTopPuerta + altoRielCorredizo / 2, zFrentePocket);
            muroFalsoPocketGroup.add(dintelPocket);

        function crearPanelLambrinContinuo(ancho, alto, offsetGlobalX = 0) {
            // PVC madera lisa con veta continua: SIN listones, SIN duelas, SIN divisiones verticales.
            const panel = crearCaja(ancho, alto, 2.0, matTKPVC);

        const posX_Pier0 = 0, posX_ModIzq = posX_Pier0 + grosorPier, posX_ModAsador = posX_ModIzq + CONFIG.modulos.izquierdo.ancho, posX_ModDer = posX_ModAsador + CONFIG.modulos.asador.ancho, posX_PierNichoIzq = posX_ModDer + CONFIG.modulos.derecho.ancho, posX_NichoNorte = posX_PierNichoIzq + grosorPier, posX_PierNichoDer = posX_NichoNorte + CONFIG.modulos.nichoNorte.ancho;

        // El lambrín decorativo de los muros se elimina. Se conserva únicamente en los frentes del mobiliario.
        function crearDetalleOrganicoMuroNorte() {
            // PANEL DE ESTUCO ORGÁNICO CONTINUO Y PEGADO AL MURO NORTE.
            // Ocupa desde el muro oeste (x=0) hasta el inicio real del nicho
            // del refrigerador (borde izquierdo del pilar), sin huecos laterales
            // ni separación posterior. La parte superior es ondulada; la parte
            // inferior queda a Y=125, por lo que cubre 95 cm y deja 66 cm de ventana.
            const g = new THREE.Group();
            g.name = 'Onda_3D_LED_Muro_Norte';
            ondaMuroNorteGroup = g;
            // Revestimiento continuo: sin separación contra el muro norte,
            // llega exactamente al muro oeste y remata en el borde exterior
            // del nicho, sin invadirlo.
            const zFront = 0.015;
            const xLeft = 0.0;
            const xRight = posX_PierNichoIzq;
            const yBottom = 125.0;

            const ptsTop = [
                new THREE.Vector3(xLeft, 205, zFront),
                new THREE.Vector3(25, 210, zFront),
                new THREE.Vector3(55, 219, zFront),
                new THREE.Vector3(88, 221, zFront),
                new THREE.Vector3(120, 216, zFront),
                new THREE.Vector3(150, 208, zFront),
                new THREE.Vector3(180, 205, zFront),
                new THREE.Vector3(210, 211, zFront),
                new THREE.Vector3(238, 219, zFront),
                new THREE.Vector3(xRight - 18, 216, zFront),
                new THREE.Vector3(xRight, 210, zFront)
            ];

            const topCurve = new THREE.CatmullRomCurve3(ptsTop, false, 'centripetal', 0.35);
            const topPts = topCurve.getPoints(240);
            const shape = new THREE.Shape();
            shape.moveTo(xLeft, yBottom);
            shape.lineTo(xLeft, topPts[0].y);
            topPts.forEach(p => shape.lineTo(p.x, p.y));
            shape.lineTo(xRight, yBottom);
            shape.closePath();

            const estuco = new THREE.Mesh(
                new THREE.ExtrudeGeometry(shape, {
                    depth: 20.0,
                    bevelEnabled: true,
                    bevelThickness: 1.4,
                    bevelSize: 1.4,
                    bevelSegments: 3
                }),
                matMuro
            );
            // Cara frontal exactamente a ras del frente del muro norte (Z=0).
            estuco.position.z = -20.0;
            estuco.renderOrder = 12;
            estuco.material.depthTest = true;
            estuco.material.depthWrite = true;
            estuco.castShadow = false;
            estuco.receiveShadow = true;
            g.add(estuco);

            // Borde de sombra: un contorno ligeramente más grueso y oscuro
            // detrás de la línea LED para que la onda conserve lectura 3D
            // incluso con iluminación frontal.
            const bordeSombraOnda = new THREE.Mesh(
                new THREE.TubeGeometry(topCurve, 240, 1.15, 12, false),
                new THREE.MeshStandardMaterial({
                    color: 0x8a6a48,
                    roughness: 0.72,
                    metalness: 0.0

            bordeSombraOnda.position.z = 0.10;

            bordeSombraOnda.receiveShadow = true;

                new THREE.TubeGeometry(topCurve, 240, 0.38, 12, false),
                new THREE.MeshBasicMaterial({ color: 0xffc985 })
            );

            led.renderOrder = 14;

            glow.position.set(155, 165, 18);
            g.add(glow);
            grupoMuroNorte.add(g);

        function generarPlanoPiso(){
            const w=parseFloat(document.getElementById('tile-w')?.value)||44;
            const h=parseFloat(document.getElementById('tile-h')?.value)||44;
            const j=parseFloat(document.getElementById('tile-j')?.value)||0;
            const box=parseFloat(document.getElementById('tile-box')?.value);
            const orient=parseFloat(document.getElementById('tile-orient')?.value)||0;
            const pts=[[0,0],[390,0],[390,400],[175.677934954,417.060258923],[175.677934954,503.060258923],[27.677934954,503.060258923],[0,487]];
            const areaCm2=Math.abs(pts.reduce((a,p,i)=>{const q=pts[(i+1)%pts.length];return a+p[0]*q[1]-q[0]*p[1]},0))/2;
            const areaM2=areaCm2/10000;
            const stepX=(orient===90?h:w)+j/10, stepZ=(orient===90?w:h)+j/10;
            const maxX=390, maxZ=503.0603, scale=1.18, pad=55;
            const tileCount=Math.ceil((maxX/stepX+1)*(maxZ/stepZ+1));
            const fullApprox=Math.floor(areaCm2/((w+j/10)*(h+j/10)));
            const gridN=Math.min(tileCount,500);
            let rects='';
            for(let i=-1;i<Math.ceil(maxX/stepX)+1;i++) for(let k=-1;k<Math.ceil(maxZ/stepZ)+1;k++){
                const x=i*stepX, z=k*stepZ;
                const rw=(orient===90?h:w), rh=(orient===90?w:h);
                rects+=`<rect x="${pad+x*scale}" y="${pad+z*scale}" width="${rw*scale}" height="${rh*scale}" fill="none" stroke="#64748b" stroke-width="1" opacity=".75"/>`;
            }
            const poly=pts.map(p=>`${pad+p[0]*scale},${pad+p[1]*scale}`).join(' ');
            const svg=`<svg viewBox="0 0 ${pad*2+maxX*scale} ${pad*2+maxZ*scale}" xmlns="http://www.w3.org/2000/svg">
              <defs><clipPath id="patioClip"><polygon points="${poly}"/></clipPath></defs>
              <rect width="100%" height="100%" fill="#fff"/>
              <g clip-path="url(#patioClip)">${rects}</g>
              <polygon points="${poly}" fill="none" stroke="#0f172a" stroke-width="3"/>
              <text x="${pad+195*scale}" y="25" text-anchor="middle" font-size="14" font-weight="700">NORTE ↑</text>
              <text x="${pad+195*scale}" y="${pad+maxZ*scale+35}" text-anchor="middle" font-size="12">Patio · geometría maestra</text>
            </svg>`;
            const waste=(fullApprox*(w+j/10)*(h+j/10)-areaCm2)/10000;
            const boxes=Number.isFinite(box)&&box>0?Math.ceil((areaM2*1.10)/box):null;
            document.getElementById('piso-result').innerHTML=`<div class="piso-metrics"><b>Área geométrica:</b> ${areaM2.toFixed(2)} m² <span>·</span><b>Pieza:</b> ${w.toFixed(1)} × ${h.toFixed(1)} cm <span>·</span><b>Junta:</b> ${j.toFixed(1)} mm</div><div class="piso-metrics"><b>Referencia de compra:</b> 17 m² en la especificación técnica. El cálculo geométrico de esta huella da ${areaM2.toFixed(2)} m². ${boxes?`Con 10% de merma: <b>${boxes} cajas</b>.`:'Ingresa m²/caja para calcular cajas.'}</div>`;
            document.getElementById('piso-plan').innerHTML=`<div class="piso-plan-title">DESPIECE / MODULACIÓN</div><div class="piso-svg">${svg}</div><div class="piso-plan-note">La retícula se recorta contra el perímetro real para identificar piezas completas y cortes perimetrales. El siguiente refinamiento será generar una lista numerada de cortes pieza por pieza.</div>`;
        }

              <line x1="${extX2}" y1="${b}" x2="${x}" y2="${b}" stroke="${color}" stroke-width="0.6"/>
              <line x1="${x-2}" y1="${a+2}" x2="${x+2}" y2="${a-2}" stroke="${color}" stroke-width="0.9"/>
